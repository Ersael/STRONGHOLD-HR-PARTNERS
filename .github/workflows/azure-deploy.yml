name: Build and deploy Node.js app to Azure Web App - stronghold-psicometricos

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install dependencies and build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          npm install
          npm run build

      - name: Prepare standalone deployment
        run: |
          mkdir -p .next/standalone/.next

          if [ -d "public" ]; then
            cp -r public .next/standalone/
          fi

          cp -r .next/static .next/standalone/.next/

          echo "=== Standalone contents ==="
          find .next/standalone -maxdepth 3 -type f | head -100

          echo "=== Server.js check ==="
          ls -la .next/standalone/server.js

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .next/standalone
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download standalone artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: ./deploy

      - name: Verify deployment files
        run: |
          echo "=== Deployment directory ==="
          ls -la ./deploy

          echo "=== Server.js ==="
          ls -la ./deploy/server.js

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_845F28B6EB10442482ECD710DB00A26F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_FEAC446699C7492F8883B242A490D9B4 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_178B139423C34D069AEA4FD6BF709144 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'stronghold-psicometricos'
          slot-name: 'Production'
          package: ./deploy